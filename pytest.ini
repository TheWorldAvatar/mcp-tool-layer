[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    mcp_surface: Public MCP registry and generic-helper exposure probes
    contract_rejection: Invalid-input rejection and no-mutation probes
    package_runtime: Shared graph, export, resume, launcher, and reasoner probes
    semantic_acceptance: LLM semantic scoring and repair acceptance probes
